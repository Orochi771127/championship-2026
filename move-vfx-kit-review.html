<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>招式特效套件｜內部審圖</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr); background: #151a1d; color: #f4f0df; font-family: system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; padding: max(.5rem, env(safe-area-inset-top)) .75rem .5rem; background: #20272a; border-bottom: 1px solid #4d6762; }
    h1 { margin: 0 auto 0 0; font-size: clamp(.85rem, 2.8vw, 1.05rem); }
    select, button { min-height: 36px; border: 1px solid #6d8e86; border-radius: 7px; color: #f4f0df; background: #263330; padding: .3rem .5rem; font-size: .8rem; }
    button[aria-pressed="true"] { background: #4a6a3a; }
    #host { min-height: 0; width: 100%; height: 100%; }
    #host canvas { display: block; width: 100%; height: 100%; }
    #evidence { position: fixed; left: .55rem; bottom: max(.55rem, env(safe-area-inset-bottom)); padding: .35rem .5rem; border-radius: 5px; background: rgb(10 15 17 / .78); color: #c9d8d4; font: 11px/1.25 ui-monospace, monospace; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>招式特效套件 v2</h1>
    <select id="move" aria-label="招式"></select>
    <button id="nextMove" type="button">下一招</button>
    <select id="style" aria-label="展演風格"></select>
    <select id="palette" aria-label="屬性色"></select>
    <button id="ultimate" type="button" aria-pressed="false">必殺</button>
    <button id="auto" type="button" aria-pressed="true">自動輪播</button>
  </header>
  <main id="host" aria-label="特效預覽"></main>
  <output id="evidence" aria-live="polite">載入中</output>
  <script type="module">
    import * as PIXI from "./node_modules/pixi.js/dist/pixi.mjs";
    import {createMoveVfxKit, moveVfxArchetype, moveVfxArchetypeIsMelee} from "./src/championship/presentation/vfx/moveVfxKit.js";
    import {moveVfxSignature} from "./src/championship/presentation/vfx/moveVfxSignatures.js";
    import {BATTLE_MOVE_NAMES} from "./src/championship/text/battleMoveNames.js";
    import table from "./src/data/championship/move-vfx-signatures.r1.json" with {type: "json"};
    import {moveVfxChoreography} from "./src/championship/presentation/vfx/moveVfxChoreography.js";
    import {createMoveVfxSetPieces} from "./src/championship/presentation/vfx/moveVfxSetPieces.js";
    import {BATTLE_FX_PALETTES} from "./src/championship/presentation/battleFx/battleFxPalettes.js";
    import {createPixelHitBursts} from "./src/championship/presentation/vfx/pixelHitBursts.js";
    import {createPixelMotes} from "./src/championship/presentation/vfx/pixelMotes.js";

    // Each style with the element colour a typical move of it carries.
    const STYLES = [["fireball", "fire", "火球"], ["flame", "fire", "火焰"], ["missile", "metal", "飛彈"], ["gatling", "metal", "機槍"],
      ["water", "water", "水"], ["ice", "ice", "冰"], ["thorn", "nature", "尖刺"], ["holy", "light", "聖光"], ["beam", "light", "光束"],
      ["thunder", "thunder", "雷"], ["dark", "dark", "暗"], ["sound", "psychic", "音波"], ["spore", "toxic", "孢子"], ["seed", "nature", "種子"],
      ["leaf", "nature", "葉"], ["quake", "earth", "地裂"], ["wind", "wind", "風"], ["strike", "neutral", "拳擊"], ["claw", "fire", "爪擊"],
      ["slash", "metal", "斬擊"], ["pierce", "light", "穿刺"],
      // Archetypes a recipe picks by name or original family (moveVfxRecipes.js).
      ["@vine", "nature", "藤鞭"], ["@roots", "nature", "樹根破地"], ["@tree", "nature", "巨樹"], ["@missile", "metal", "飛彈"],
      ["@gatling", "metal", "機槍"], ["@cannon", "metal", "砲彈"], ["@meteor", "fire", "隕石"], ["@pillar", "fire", "火柱"],
      ["@spikes", "ice", "冰刺"], ["@tornado", "wind", "龍捲風"], ["@arrows", "light", "箭雨"], ["@blackhole", "dark", "黑洞"], ["@bite", "neutral", "咬擊"]];
    const PALETTES = ["fire", "water", "ice", "light", "dark", "thunder", "nature", "metal", "earth", "toxic", "psychic", "wind", "neutral"];
    const params = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    // Every move by its signature (UNIQUE_PIXEL_MOVE_VFX_20261108); "" plays the style menu instead.
    const TIER = {basic: "普攻", skill: "技能", ultimate: "必殺", support: "輔助"};
    const MOVES = table.moves.map(([key]) => moveVfxSignature(key)).filter(s => s.tier !== "support");
    $("move").append(new Option("（依風格）", ""));
    for (const s of MOVES) $("move").append(new Option(`${BATTLE_MOVE_NAMES[s.key]?.[0] ?? s.key}｜${TIER[s.tier]}｜${s.archetype}`, String(s.key)));
    if (params.get("move")) $("move").value = params.get("move");
    $("nextMove").onclick = () => { const i = $("move").selectedIndex; $("move").selectedIndex = i + 1 < $("move").options.length ? i + 1 : 1; next = time + 150; };
    for (const [key, , label] of STYLES) $("style").append(new Option(`${label}（${key}）`, key));
    $("palette").append(new Option("依風格", ""));
    for (const key of PALETTES) $("palette").append(new Option(key, key));
    if (params.get("style")) $("style").value = params.get("style");
    if (params.get("palette")) $("palette").value = params.get("palette");
    const state = {auto: params.get("auto") !== "0", ultimate: params.get("ultimate") === "1"};
    $("auto").setAttribute("aria-pressed", String(state.auto));
    $("ultimate").setAttribute("aria-pressed", String(state.ultimate));

    const app = new PIXI.Application();
    await app.init({resizeTo: $("host"), backgroundColor: 0x2f5a24, antialias: true, autoDensity: true, resolution: Math.min(2, devicePixelRatio)});
    $("host").append(app.canvas);
    // A grass field like the arena's, with soft light patches.
    const field = new PIXI.Graphics();
    const drawField = () => {
      field.clear().rect(0, 0, app.screen.width, app.screen.height).fill(0x4f8a2c);
      for (let i = 0; i < 18; i++) field.circle((i * 397) % app.screen.width, (i * 211) % app.screen.height, 60 + (i * 37) % 90).fill({color: i % 2 ? 0x5f9c34 : 0x447a26, alpha: 0.5});
    };
    drawField(); app.renderer.on("resize", drawField);
    const groundLayer = new PIXI.Container(), actorLayer = new PIXI.Container(), front = new PIXI.Container();
    app.stage.addChild(field, groundLayer, actorLayer, front);
    const kit = createMoveVfxKit({PIXI, front, ground: groundLayer, quality: params.get("quality") ?? "balanced", pixel: params.get("pixel") !== "0"});
    // The move's own release and contact pieces, hit-stop, shake and knock (BESPOKE_MOVE_VFX_PROGRAM_20261111).
    const pieceLayer = new PIXI.Container(); app.stage.addChild(pieceLayer);
    const pieces = createMoveVfxSetPieces({PIXI, layer: pieceLayer});
    // ?body=72: the struck body's width in px; the AI battle passes the same width to every contact layer.
    const BODY = Number(params.get("body") ?? 72), UNIT = BODY / 64, SHAKE = {light: 3, medium: 6, heavy: 10};
    const pixelHits = createPixelHitBursts({PIXI, layer: pieceLayer}), motes = createPixelMotes({PIXI, layer: pieceLayer});
    const ELEMENT = {fire: "FIRE", water: "WATER", ice: "ICE", thunder: "THUNDER", metal: "METAL", nature: "WOOD", earth: "EARTH", wind: "WIND", light: "SUN", dark: "MOON"};
    const feel = {holdMs: 0, shakeMs: 0, shakePx: 0, knock: 0, knockDir: 1, log: []};
    // Two stand-ins: a shadow and a body, so the shots have somewhere to go.
    const actor = tint => { const g = new PIXI.Graphics(), w = Number(params.get("body") ?? 72); g.ellipse(0, 0, w * 0.8, w * 0.28).fill({color: 0x000000, alpha: 0.3}); g.roundRect(-w / 2, -w * 1.35, w, w * 1.3, w * 0.35).fill(tint); actorLayer.addChild(g); return g; };
    const caster = actor(0x6fd0ff), target = actor(0xff8a7a);

    const shots = [];
    let time = 0, next = 400, round = 0;
    const look = () => {
      const raw = $("move").value, signature = raw ? moveVfxSignature(/^\d+$/.test(raw) ? Number(raw) : raw) : null;
      if (signature) return {style: signature.key, archetype: signature.archetype, paletteKey: $("palette").value || signature.paletteKey, signature};
      const entry = STYLES.find(([key]) => key === $("style").value) ?? STYLES[0];
      const archetype = entry[0].startsWith("@") ? entry[0].slice(1) : moveVfxArchetype(entry[0]);
      return {style: entry[0], archetype, paletteKey: $("palette").value || entry[1], signature: null};
    };
    const ultimateNow = () => look().signature ? look().signature.tier === "ultimate" : state.ultimate;
    function place() {
      // Each round fires a new direction, so a shot's turn is visible.
      // ?fixed=1: always left to right, as the arena's opening face-off.
      const w = app.screen.width, h = app.screen.height, a = params.get("fixed") === "1" ? Math.PI : round * 2.39996;
      const cx = w / 2, cy = h * 0.55, r = Math.min(w, h) * 0.32;
      caster.position.set(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8);
      target.position.set(cx - Math.cos(a) * r * 0.9, cy - Math.sin(a) * r * 0.7);
    }
    function fire() {
      const {archetype, paletteKey, signature} = look(), ultimate = ultimateNow();
      place(); round++;
      const hand = {x: caster.x + BODY * 0.3, y: caster.y - BODY * 0.85}, hit = {x: target.x, y: target.y - BODY * 0.65};
      const angle = Math.atan2(hit.y - hand.y, hit.x - hand.x);
      kit.charge({x: hand.x, y: hand.y, paletteKey, size: ultimate ? 44 : 32, ms: ultimate ? 520 : 320, signature});
      const after = ultimate ? 520 : 320;
      const choreo = signature ? moveVfxChoreography(signature.key) : null, palette = BATTLE_FX_PALETTES[paletteKey] ?? BATTLE_FX_PALETTES.neutral;
      feel.log.push({event: "fire", at: performance.now()});
      if (choreo?.release) setTimeout(() => { pieces.play(choreo.release.piece, {x: hand.x, y: hand.y, angle, palette, size: BODY, unit: UNIT, groundY: caster.y, scale: choreo.release.scale ?? 1, sprite: choreo.release.sprite ?? null}); feel.log.push({event: "release", at: performance.now()}); }, after);
      setTimeout(() => {
        if (moveVfxArchetypeIsMelee(archetype)) {
          kit.melee({x: hand.x, y: hand.y, angle, paletteKey, archetype, signature});
          setTimeout(() => land(archetype, paletteKey, hit, angle, signature, ultimate), 120 + 85 * ((signature?.combo ?? 1) - 1));
          return;
        }
        kit.launch({x: hand.x, y: hand.y, angle, paletteKey, archetype, signature});
        if (archetype === "lance" && ultimate) {
          kit.beam({x0: hand.x, y0: hand.y, x1: hit.x, y1: hit.y, paletteKey, ms: 520, width: 30});
          setTimeout(() => land(archetype, paletteKey, hit, angle, signature, ultimate), 360);
          return;
        }
        const shot = {x: hand.x, y: hand.y, vx: Math.cos(angle) * 560, vy: Math.sin(angle) * 560, alive: true, archetype, paletteKey, hit, angle, signature, ultimate};
        shot.handle = kit.projectile({follow: () => shot.alive ? shot : null, paletteKey, archetype, size: ultimate ? 38 : 30, signature});
        shots.push(shot);
      }, after);
    }
    function land(archetype, paletteKey, hit, angle, signature = null, ultimate = state.ultimate) {
      const args = {x: hit.x, y: hit.y, groundY: target.y, angle, paletteKey, archetype, signature};
      // As the AI battle plays a hit: a heavy impact for an ultimate (the field-wide signature close
      // belongs to the Data Arena's 80 TP finisher only; ?close=1 shows it here).
      if (ultimate && params.get("close") === "1") kit.signature(args);
      else if (signature) {
        // The AI battle's HIT: the move's closing burst, the element's motes and pixel hit burst, sized by the body.
        const heavy = ultimate || signature.tier === "skill";
        kit.burst({...args, size: BODY * (heavy ? 0.24 : 0.18), heavy: ultimate});
        const element = ELEMENT[paletteKey] ?? "NEUTRAL";
        motes?.burst({element, x: hit.x, y: hit.y, groundY: target.y, unit: UNIT, weight: ultimate ? "ultimate" : heavy ? "medium" : "light", dir: Math.cos(angle) < 0 ? -1 : 1});
        pixelHits?.spawn({element, x: hit.x, y: hit.y, groundY: target.y, size: BODY, unit: UNIT, heavy: ultimate, flip: Math.cos(angle) < 0});
      } else kit.impact({...args, heavy: round % 3 === 0});
      const choreo = signature ? moveVfxChoreography(signature.key) : null;
      if (choreo?.contact) {
        const pal = BATTLE_FX_PALETTES[paletteKey] ?? BATTLE_FX_PALETTES.neutral;
        if (choreo.impactFrame) pieces.play("impact-frame", {x: hit.x, y: hit.y, angle, palette: {core: 0xffffff, main: 0xffffff, edge: 0xffffff, flat: true}, size: BODY, unit: UNIT, groundY: target.y, scale: choreo.contact.scale ?? 1});
        pieces.play(choreo.contact.piece, {x: hit.x, y: hit.y, angle, palette: BATTLE_FX_PALETTES[paletteKey] ?? BATTLE_FX_PALETTES.neutral, size: BODY, unit: UNIT, groundY: target.y,
          scale: choreo.contact.scale ?? 1, fast: choreo.contact.fast, sprite: choreo.contact.sprite ?? null, at: "contact"});
        feel.holdMs = choreo.hitStopMs ?? 0; feel.shakeMs = 220; feel.shakePx = SHAKE[choreo.shake] ?? 0;
        feel.knock = choreo.knockPx ?? 0; feel.knockDir = Math.cos(angle) < 0 ? -1 : 1;
      }
      feel.log.push({event: "contact", at: performance.now()});
    }
    app.ticker.add(ticker => {
      const real = ticker.deltaMS;
      // A hit-stop holds the shots and the effects; the screen shake and the knock run on real time.
      const dt = feel.holdMs > 0 ? 0 : real; feel.holdMs = Math.max(0, feel.holdMs - real); time += real;
      if (feel.shakeMs > 0) { feel.shakeMs = Math.max(0, feel.shakeMs - real); const k = feel.shakeMs / 220 * feel.shakePx; app.stage.position.set(Math.round((Math.random() * 2 - 1) * k), Math.round((Math.random() * 2 - 1) * k)); } else app.stage.position.set(0, 0);
      if (feel.knock > 0.5) { const step = feel.knock * Math.min(1, real / 60); target.x += feel.knockDir * step; feel.knock -= step; }
      pieces.update(dt); pixelHits?.update(dt); motes?.update(dt);
      for (const shot of shots) {
        if (!shot.alive) continue;
        shot.x += shot.vx * dt / 1000; shot.y += shot.vy * dt / 1000;
        if ((shot.hit.x - shot.x) * shot.vx + (shot.hit.y - shot.y) * shot.vy <= 0) { shot.alive = false; land(shot.archetype, shot.paletteKey, shot.hit, shot.angle, shot.signature, shot.ultimate); }
      }
      for (let i = shots.length - 1; i >= 0; i--) if (!shots[i].alive) shots.splice(i, 1);
      kit.update(dt);
      if (state.auto && time >= next) { next = time + 1900; fire(); }
      const d = kit.getDiagnostics();
      const s = look().signature;
      const own = s ? ` · ${s.tier} ${s.melee ? `combo ${s.combo} ${s.swing}` : `volley ${s.volley} ${s.path}`} · ×${s.scale} · ${s.trail} · ${s.burst} · sigil ${s.sigil.toString(16)}` : "";
      $("evidence").textContent = `${look().style} → ${look().archetype} · ${look().paletteKey}${own} · live ${d.live} · sheets ${d.sheets} · fps ${Math.round(app.ticker.FPS)}`;
    });
    $("auto").onclick = () => { state.auto = !state.auto; $("auto").setAttribute("aria-pressed", String(state.auto)); };
    $("ultimate").onclick = () => { state.ultimate = !state.ultimate; $("ultimate").setAttribute("aria-pressed", String(state.ultimate)); };
    app.canvas.addEventListener("pointerdown", () => fire());
    for (const id of ["move", "style", "palette"]) $(id).onchange = () => { next = time + 200; };
    window.__moveVfxKit = {kit, fire, state, look, app, pieces, feel, select: key => { $("move").value = String(key); }};
  </script>
</body>
</html>
