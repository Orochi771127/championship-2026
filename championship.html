      // Player preferences before the first paint (settings round, 2026-09-29).
      // Read-only, and a mirror of settings/preferenceEnvironment.js and the
      // "auto" start of settings/qualityController.js, so a saved theme, reading
      // size or language never flashes the default one first; the modules take
      // over as soon as they load. tests/championship-settings-cases.mjs runs
      // this script against the modules' own mapping.
      (function () {
        var root = document.documentElement, p = {}, k;
        try {
          var d = JSON.parse(window.localStorage.getItem("championshipModernSave:preferences:v1") || "null");
          if (d && typeof d === "object" && !Array.isArray(d)) {
            if (d.schemaVersion === 1) {
              for (k in (d.account || {})) p[k] = d.account[k];
              for (k in (d.device || {})) p[k] = d.device[k];
            } else if (d.schemaVersion === undefined) p = d;
          }
        } catch (error) { p = {}; }
        function query(text) { try { return window.matchMedia(text).matches === true; } catch (error) { return false; } }
        function pick(value, allowed, fallback) { return allowed.indexOf(value) >= 0 ? value : fallback; }
        var choice = pick(p.theme, ["night", "clear", "warm", "classic", "system"], "night");
        var dark = typeof window.matchMedia === "function" ? query("(prefers-color-scheme: dark)") : true;
        var theme = choice === "system" ? (dark ? "night" : "clear") : choice;
        var motion = pick(p.reducedMotion, ["system", "on", "off"], "system");
        var quality = pick(p.quality, ["auto", "saver", "balanced", "high"], "auto");
        var nav = window.navigator || {};
        if (quality === "auto") {
          quality = (nav.connection && nav.connection.saveData === true)
            || (nav.deviceMemory > 0 && nav.deviceMemory <= 2)
            || (nav.hardwareConcurrency > 0 && nav.hardwareConcurrency <= 2) ? "saver" : "balanced";
        }
        root.dataset.theme = theme;
        root.dataset.themeChoice = choice;
        root.dataset.textScale = String(pick(p.textScale, [100, 115, 130], 100));
        root.dataset.hud = pick(p.hudDensity, ["standard", "compact"], "standard");
        root.dataset.motion = motion === "on" || (motion === "system" && query("(prefers-reduced-motion: reduce)")) ? "reduced" : "full";
        root.dataset.flash = pick(p.flashIntensity, ["standard", "soft"], "standard");
        root.dataset.highlight = pick(p.highlightMode, ["full", "compact"], "full");
        root.dataset.quality = quality;
        root.lang = pick(p.locale, ["zh-Hant", "en"], "zh-Hant");
        var color = document.querySelector('meta[name="theme-color"]');
        if (color) color.setAttribute("content", { night: "#0b181c", clear: "#eef3f8", warm: "#f7efd6", classic: "#072f5e" }[theme]);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", theme === "night" || theme === "classic" ? "dark" : "light");
      })();

        <div class="cm-title__actions" hidden>
          <button id="cm-new-game" class="cm-button cm-button--primary" type="button">開始新遊戲</button>
          <button id="cm-continue" class="cm-button" type="button" disabled>繼續遊戲</button>
        </div>
        <div id="cm-opening" hidden></div>
        <p id="cm-title-note" class="cm-title__note" role="status"></p>
      </div>
    </div>
    <div id="cm-root" hidden></div>
    <noscript>數碼獸冠軍賽 2026 需要啟用 JavaScript 才能執行。</noscript>
    <script>
      if (window.location.protocol === "file:") {
        document.querySelector("#cm-new-game").disabled = true;
        document.querySelector("#cm-continue").disabled = true;
        document.querySelector("#cm-title-note").textContent =
          "請使用 START_CHAMPIONSHIP.cmd 啟動。瀏覽器不能直接執行本機 HTML 的遊戲模組。";
        document.documentElement.dataset.launchBlocked = "FILE_PROTOCOL";
      } else {
        const gameModule = document.createElement("script");
        gameModule.type = "module";
        gameModule.src = "./src/championship/app/main.js?v=settings-2";
        document.body.appendChild(gameModule);
      }
    </script>
  </body>
