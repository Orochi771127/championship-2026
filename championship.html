      // Player preferences before the first paint (settings round, 2026-09-29).
      // Read-only, and a mirror of settings/preferenceEnvironment.js and the
      // "auto" start of settings/qualityController.js, so a saved theme, reading
      // size or language never flashes the default one first; the modules take
      // over as soon as they load. tests/championship-settings-cases.mjs runs
      // this script against the modules' own mapping.
      (function () {
        var root = document.documentElement, p = {}, k;
        try {
          var d = JSON.parse(window.localStorage.getItem("championshipModernSave:preferences:v1") || "null");
          if (d && typeof d === "object" && !Array.isArray(d)) {
            if (d.schemaVersion === 1) {
              for (k in (d.account || {})) p[k] = d.account[k];
              for (k in (d.device || {})) p[k] = d.device[k];
            } else if (d.schemaVersion === undefined) p = d;
          }
        } catch (error) { p = {}; }
        function query(text) { try { return window.matchMedia(text).matches === true; } catch (error) { return false; } }
        function pick(value, allowed, fallback) { return allowed.indexOf(value) >= 0 ? value : fallback; }
        var choice = pick(p.theme, ["arcade", "arena", "night", "clear", "warm", "classic", "system"], "arcade");
        var dark = typeof window.matchMedia === "function" ? query("(prefers-color-scheme: dark)") : true;
        var theme = choice === "system" ? (dark ? "night" : "arena") : choice;
        var motion = pick(p.reducedMotion, ["system", "on", "off"], "system");
        var quality = pick(p.quality, ["auto", "saver", "balanced", "high"], "auto");
        var nav = window.navigator || {};
        if (quality === "auto") {
          quality = (nav.connection && nav.connection.saveData === true)
            || (nav.deviceMemory > 0 && nav.deviceMemory <= 2)
            || (nav.hardwareConcurrency > 0 && nav.hardwareConcurrency <= 2) ? "saver" : "balanced";
        }
        root.dataset.theme = theme;
        root.dataset.themeChoice = choice;
        root.dataset.textScale = String(pick(p.textScale, [100, 115, 130], 100));
        root.dataset.hud = pick(p.hudDensity, ["standard", "compact"], "standard");
        root.dataset.motion = motion === "on" || (motion === "system" && query("(prefers-reduced-motion: reduce)")) ? "reduced" : "full";
        root.dataset.flash = pick(p.flashIntensity, ["standard", "soft"], "standard");
        root.dataset.highlight = pick(p.highlightMode, ["full", "compact"], "full");
        root.dataset.quality = quality;
        root.lang = pick(p.locale, ["zh-Hant", "en", "ja", "th", "vi"], "zh-Hant");
        var color = document.querySelector('meta[name="theme-color"]');
        if (color) color.setAttribute("content", { arcade: "#2b1d4a", arena: "#eef5fa", night: "#080b0a", clear: "#eef3f8", warm: "#f7efd6", classic: "#072f5e" }[theme]);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", theme === "night" || theme === "classic" ? "dark" : "light");
      })();

    <script>
      // Runs without the module graph. Reload never clears preferences or save.
      (function () {
        const copy = {
          "zh-Hant": ["進入遊戲", "正在啟動遊戲…", "啟動時間較長。可以繼續等待，或重新載入；存檔不會被清除。", "遊戲未能啟動。請重新載入；存檔不會被清除。", "重新載入"],
          en: ["Enter game", "Starting the game…", "Starting is taking longer. You can wait or reload; your save will be kept.", "The game could not start. Please reload; your save will be kept.", "Reload"],
          ja: ["ゲームに入る", "ゲームを起動中…", "起動に時間がかかっています。待つか再読み込みしてください。セーブデータは保持されます。", "起動できませんでした。再読み込みしてください。セーブデータは保持されます。", "再読み込み"],
          th: ["เข้าสู่เกม", "กำลังเริ่มเกม…", "ใช้เวลาเริ่มเกมนานกว่าปกติ คุณรอหรือโหลดใหม่ได้ ข้อมูลที่บันทึกไว้จะยังอยู่", "เริ่มเกมไม่ได้ โปรดโหลดใหม่ ข้อมูลที่บันทึกไว้จะยังอยู่", "โหลดใหม่"],
          vi: ["Vào trò chơi", "Đang khởi động trò chơi…", "Khởi động lâu hơn dự kiến. Bạn có thể chờ hoặc tải lại; bản lưu vẫn được giữ.", "Không thể khởi động trò chơi. Hãy tải lại; bản lưu vẫn được giữ.", "Tải lại"]
        };
        const words = copy[document.documentElement.lang] || copy["zh-Hant"];
        const panel = document.getElementById("cm-boot-status"), message = document.getElementById("cm-boot-message"), retry = document.getElementById("cm-boot-retry");
        document.getElementById("cm-login").textContent = words[0]; message.textContent = words[1]; retry.textContent = words[4];
        document.documentElement.dataset.bootState = "loading";
        let ready = false, timer;
        function failed(slow) {
          if (ready) return;
          if (!slow) clearTimeout(timer);
          document.documentElement.dataset.bootState = slow ? "slow" : "error";
          message.textContent = words[slow ? 2 : 3]; retry.hidden = false;
        }
        function runtimeError() { failed(false); }
        retry.addEventListener("click", () => { retry.disabled = true; window.location.reload(); });
        window.addEventListener("championship:ready", () => {
          ready = true; clearTimeout(timer); panel.hidden = true;
          document.documentElement.dataset.bootState = "ready";
          window.removeEventListener("error", runtimeError);
          window.removeEventListener("championship:boot-error", runtimeError);
        }, { once: true });
        if (window.location.protocol === "file:") {
          document.querySelector("#cm-new-game").disabled = true;
          document.querySelector("#cm-continue").disabled = true;
          message.textContent = "請使用 START_CHAMPIONSHIP.cmd 啟動。瀏覽器不能直接執行本機 HTML 的遊戲模組。";
          document.documentElement.dataset.launchBlocked = "FILE_PROTOCOL";
          return;
        }
        timer = setTimeout(() => failed(true), 30000);
        window.addEventListener("error", runtimeError);
        window.addEventListener("championship:boot-error", runtimeError);
        const gameModule = document.createElement("script");
        gameModule.type = "module";
        gameModule.src = "./src/championship/app/main.js?v=settings-2";
        gameModule.addEventListener("error", runtimeError, { once: true });
        document.body.appendChild(gameModule);
      })();
    </script>
