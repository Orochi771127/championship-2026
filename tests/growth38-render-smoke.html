<!doctype html><meta charset="utf-8"><title>Growth renderer test</title><body style="margin:0;background:#dae3ec"><script type="module">
import * as PIXI from '/node_modules/pixi.js/dist/pixi.mjs';
import {loadPixiCharacterRuntimeBundle} from '/src/championship/presentation/pixiCharacterRuntimeBundle.js';
import {applyNativeCharacterCellGeometry,NATIVE_HUNT_CHARACTER_FRAME_CONTRACT} from '/src/championship/presentation/nativeHuntCharacterAction.js';
const app=new PIXI.Application();await app.init({width:1152,height:680,background:0xdae3ec,resolution:1,preference:'webgl'});document.body.append(app.canvas);
const catalog=await (await fetch('/src/data/championship/public-character-catalog.v1.json')).json();
window.runCharacter=async id=>{
 const config=catalog.characters.find(c=>c.speciesId===id),url=new URL('/'+config.runtimePath,location.href).href;
 const runtime=await (await fetch(url)).json();
 const bundle=await loadPixiCharacterRuntimeBundle({PIXI,runtimeUrl:url,runtimeDocument:runtime,sides:['main'],authoredArena:true});
 for(const [row,action]of ['walk','melee','ranged','hurt'].entries())for(let d=0;d<8;d++){
  const actor=bundle.createActor({side:'main',animation:2}),sprite=actor.sprite;
  const seq=runtime.sides.main.animations.find(s=>s.id===2);
  const result=actor.applyAuthoredArena({sequenceId:2,direction:d,action,sample:{frameIndex:0,elapsedQ12:seq.frames[0].ticks*2048,active:1}});
  if(!result)throw Error(id+'/'+action+'/'+d);
  const p=result.placement; sprite.scale.set((p.mirrorX?-1:1)*3/p.scale,3/p.scale);sprite.position.set(72+d*144,132+row*156);app.stage.addChild(sprite);
  const label=new PIXI.Text({text:`${action} ${d}`,style:{fontSize:13,fill:0x111111}});label.position.set(20+d*144,8+row*156);app.stage.addChild(label);
 }
 app.render();window.clearCharacter=async()=>{app.stage.removeChildren().forEach(c=>c.destroy());await bundle.dispose();};return bundle.getDiagnostics();
};
window.testStream=async id=>{const c=catalog.characters.find(c=>c.speciesId===id),u=new URL('/'+c.runtimePath,location.href).href,r=await(await fetch(u)).json();const b=await loadPixiCharacterRuntimeBundle({PIXI,runtimeUrl:u,runtimeDocument:r,sides:['main'],initialSequenceIds:[0]});const a=b.createActor({side:'main',animation:0,nativeFramePresentation:true,nativeGeometry:r.geometry});const seq=r.sides.main.animations[0];const frame=a.nativeFramePresenter.apply({sequenceId:0,frameIndex:0,cell:seq.frames[0].cell,elapsedQ12:0,active:1,flipBits:0,contract:NATIVE_HUNT_CHARACTER_FRAME_CONTRACT});applyNativeCharacterCellGeometry(a.sprite,frame);await a.nativeFramePresenter.ensureFrame?.({sequenceId:2});const walk=r.sides.main.animations.find(s=>s.id===2);a.nativeFramePresenter.apply({sequenceId:2,frameIndex:0,cell:walk.frames[0].cell,elapsedQ12:0,active:1,flipBits:0,contract:NATIVE_HUNT_CHARACTER_FRAME_CONTRACT});const d=b.getDiagnostics();a.sprite.destroy();await b.dispose();return d;};
window.ready=true;
</script>
