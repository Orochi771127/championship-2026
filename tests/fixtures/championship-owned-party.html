<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>自有隊伍受控驗收</title>
<style>body{background:#142331;color:white;font:16px system-ui}button{padding:12px}iframe{display:block;width:390px;height:780px;border:0;margin-top:16px}</style>
<p>受控成年個體／比賽日期存檔；後續操作使用正式遊戲入口。僅限本機測試。</p>
<button id="prepare">準備驗收存檔</button><p id="status" role="status">尚未準備</p><iframe title="正式遊戲"></iframe>
<button id="prepare-championship">準備大會隊伍驗收存檔</button>
<button id="prepare-practice">準備練習兩隊驗收存檔</button>
<script type="module">
import {createChampionshipStandaloneApp} from '../../src/championship/app/championshipStandaloneApp.js';
import {createNativeHuntIndividual} from '../../src/championship/hunt/capture/nativeHuntIndividual.js';
import {nativeHuntSpeciesByIndex} from '../../src/championship/hunt/capture/nativeHuntSources.js';
import {nativeIndividualProfile} from '../../src/championship/raising/nativeIndividualProfile.js';
import {CHAMPIONSHIP_MODERN_SAVE_KEY} from '../../src/championship/app/championshipStandaloneSave.js';
async function prepare(championship=false,practice=false){
 const catalog=await fetch('../../src/data/championship/catalogs/creature-species.r1.json').then(r=>r.json());
 const {cages}=await fetch('../../docs/contracts/championship/raising-home-presentation.v1.json').then(r=>r.json());
 const app=createChampionshipStandaloneApp({storage:localStorage,catalog,cages,rngClock:()=>({hour:13,minute:20,second:50})});
 try{
  await app.newGame();app.save();const save=JSON.parse(localStorage.getItem(CHAMPIONSHIP_MODERN_SAVE_KEY));
  const species=championship?217:34;
  save.creature.nativeProfile=nativeIndividualProfile(createNativeHuntIndividual({species:nativeHuntSpeciesByIndex(species),rng:{next:()=>11}}));
  save.creature.speciesId=`species-${String(species).padStart(3,'0')}`;save.creature.displayName='隊伍驗收';
  if(championship)save.progression.nativeTitles.championship={stage:1,entry:1,worldEntry:0};
  if(practice){
    save.raising.collection.push({instanceId:'practice:other',speciesId:'species-034',displayName:'乙隊驗收',
      nativeProfile:nativeIndividualProfile(createNativeHuntIndividual({species:nativeHuntSpeciesByIndex(34),rng:{next:()=>11}})),
      enclosedAt:null,originGateId:null,successAuthority:'CONTROLLED_TEST_PROFILE'});
    save.raising.assignments['practice:other']=save.raising.assignments[save.creature.creatureId];
  }
  localStorage.setItem(CHAMPIONSHIP_MODERN_SAVE_KEY,JSON.stringify(save));await app.continueGame();
  app.advanceClock({units:19*1440*400});app.creditBits(150);app.save();
  document.querySelector('#status').textContent='受控存檔已準備；請登入、繼續遊戲並從工具列參賽。';
 }finally{await app.dispose();}
 document.querySelector('iframe').src='../../championship.html';
}
document.querySelector('#prepare').addEventListener('click',()=>prepare());
document.querySelector('#prepare-championship').addEventListener('click',()=>prepare(true));
document.querySelector('#prepare-practice').addEventListener('click',()=>prepare(false,true));
</script></html>
