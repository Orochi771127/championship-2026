   const gpu=actual.gpuDebug.mask;const originalGpu=actual.gpuDebug.original;for(const part of actual.gpuDebug.logicalMeshes)requireValue(part.mask.programAvailable&&part.mask.shaders?.length,'EVERY_ACTIVE_PART_SHADER_REQUIRED');requireValue(gpu.programAvailable&&gpu.shaders,'ACTUAL_COMPILED_SHADER_REQUIRED');const shaderSha256=await digest(encode(gpu.shaders));gpu.shaderFlags=gpu.shaders.map(({type,hasFloorProxy,hasFragDepth})=>({type,hasFloorProxy,hasFragDepth}));gpu.compiledShaderSources=gpu.shaders;delete gpu.shaders;if(originalGpu.shaders){originalGpu.shaderSha256=await digest(encode(originalGpu.shaders));delete originalGpu.shaders;}
   const upperNormal=[];for(let y=0;y<unchangedRows;y++)for(let x=0;x<390;x++)if(reference.rgba[(y*390+x)*4]>0){const p=((843-y)*390+x)*4;for(let k=0;k<4;k++)upperNormal.push(before.three[p+k]);}
   output.push({upperNormalThreeSha256:await digest(new Uint8Array(upperNormal)),target:pair.target,reference:rle(reference),actual:rle(actual),coverage:pair.coverage,controls:pair.controls,referenceSha256:await digest(reference.rgba),actualSha256:await digest(actual.rgba),upperReferenceSha256:await digest(reference.rgba.slice(0,unchangedRows*390*4)),upperActualSha256:await digest(actual.rgba.slice(0,unchangedRows*390*4)),unchangedRows,gpuDebug:{actual:{original:originalGpu,mask:gpu,logicalMeshes:actual.gpuDebug.logicalMeshes,originalLogicalMeshes:actual.gpuDebug.originalLogicalMeshes}},shaderSha256});
  }
  requireValue(JSON.stringify(before.layout)===JSON.stringify(after.layout),'LAYOUT_RESTORATION_DRIFT');
  const result={frameIndex,targetGeometry,layout:before.layout,normalHashes,beforeState:before.state,pairs:output,sceneClock:before.state.sceneClock,groundAdmission:subjectRoot.threeGroundAdmission,subjectKey:key,diagnostics:scene.getDiagnostics(),maskScope:'ISOLATED_TARGET_TERRAIN_ONLY_EQUAL_DEPTH_ORDER_LIMITATION;OWN_TARGET_MSAA_INTENSITY',shadowScope:'EXACT_REPLICATED_FALLBACK_PIXI_LAYER_NOT_NORMAL_REVIEWED_CONTACT'};globalThis.lastMotionDiagnostic=result;return result;
 },
 async captureGrassAttribution(){
  requireValue(motion.test.fieldId==='field_cm02_01'&&motion.test.subjectKind==='food'&&motion.test.id.includes('-interior-'),'EXACT_GRASS_WITNESS_CASE_ONLY');
  const key=motion.subjectKey,records=[];
  const rle=m=>{const runs=[];let value=m.rgba[0],count=0;for(let i=0;i<m.rgba.length;i+=4){const v=m.rgba[i];requireValue(m.rgba[i+1]===v&&m.rgba[i+2]===v,'GRAYSCALE_REQUIRED');if(v===value)count++;else{runs.push([count,value]);value=v;count=1;}}runs.push([count,value]);return {width:m.width,height:m.height,runs};};
  try{for(const triangleMode of ['without-grass','only-grass']){const r=await scene.captureActorMaskTriangleControl({key,target:'default',reference:false,debugGPU:true,triangleMode});records.push({triangleMode,mask:rle(r),triangleControl:r.triangleControl});globalThis.lastMotionDiagnostic={stage:'GRASS_ATTRIBUTION',records};}return records;}finally{motion.render(0);}
 },
 async settleNormalFrame(){
  requireValue(scene&&motion,'MOTION_REQUIRED');
  const pose=()=>{const frame=actor.nativeFramePresenter.getSnapshot();return {sequenceId:frame.sequenceId,frameIndex:frame.frameIndex,cell:frame.cell,root:[root.x,root.y,root.scale.x,root.scale.y],sprite:[actor.sprite.x,actor.sprite.y,actor.sprite.scale.x,actor.sprite.scale.y]};};
  const before=pose(),clockBefore=scene.captureActorMaskState().sceneClock;
  // No ticker/native tick is advanced. Give compositor a frame boundary, then
  // explicitly update actual Pixi parent/child world transforms before drawing.
  await new Promise(requestAnimationFrame);
  for(const item of [root,actor.sprite,motion.shadow,...props])item.toGlobal({x:0,y:0});
  const pixi={root:root.toGlobal({x:0,y:0}),shadow:motion.shadow.toGlobal({x:0,y:0}),sprite:actor.sprite.toGlobal({x:0,y:0})};
  await this.redrawNormal();
  const after=pose(),clockAfter=scene.captureActorMaskState().sceneClock;
  requireValue(JSON.stringify(before)===JSON.stringify(after)&&clockBefore===clockAfter,'SETTLE_MUST_NOT_ADVANCE_POSE_OR_SCENE_CLOCK');
  return {pose:after,sceneClock:clockAfter,pixi,method:'RAF_BOUNDARY_EXPLICIT_PIXI_WORLD_TRANSFORMS_ZERO_DELTA_RENDER'};
 },
 async redrawNormal(){
  requireValue(scene&&motion,'MOTION_REQUIRED');app.render();scene.render({bounds:motion.bounds,actors:new Map([['audit',{root,sprite:actor.sprite,shadow:motion.shadow}]]),food:motion.food,waste:motion.waste,deltaMS:0});app.render();return scene.getDiagnostics();
 },
