<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunt field review fixture — capture VFX reachability</title>
<link rel="stylesheet" href="../../src/championship/app/styles.css">
<link rel="stylesheet" href="../../src/championship/app/intRh2Styles.css">
<link rel="stylesheet" href="../../src/championship/app/vs2Styles.css">
<link rel="stylesheet" href="../../src/championship/app/vs5Styles.css">
<link rel="stylesheet" href="../../src/championship/app/raisingHomeHud.css">
<link rel="stylesheet" href="../../src/championship/app/huntMobile.css">
<link rel="stylesheet" href="../../src/championship/app/facilityBattleMobile.css">
<link rel="stylesheet" href="../../src/championship/app/opening.css">
<link rel="stylesheet" href="../../src/championship/app/trainingLabels.css">
<link rel="stylesheet" href="../../src/championship/app/shopOriginalVideo.css">
<link rel="stylesheet" href="../../src/championship/app/nativeUiSkin.css">
<style>
 body{margin:0;background:#06141e;color:#fff;font-family:Arial}
 #fixture{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#0d2330;padding:6px;font-size:12px}
 #fixture button{min-height:40px;margin-right:4px}
 #app.cm-vs2-root{bottom:64px}
 #phase{display:inline-block;min-width:22ch}
</style>
<main id="app"></main>
<aside id="fixture">
 RESEARCH FIXTURE — the real Hunt field, mounted the way main.js mounts it.<br>
 The capture VFX cannot be triggered from here: see the comment at the top of the module script.<br>
 <button id="run">Capture and play the VFX</button>
 <button id="step">Tick 1 phase</button>
 <output id="phase">idle</output>
</aside>
<script type="module">
/*
 * Mounts the REAL Hunt field presentation the way main.js does — the first
 * fixture to do so.
 *
 * CORRECTION, 2026-09-13. An earlier version of this comment claimed the
 * capture VFX had no reachable trigger. That was wrong. The chain is wired:
 * the field pointer adapter calls intents.toolPointerDown/Move/Up, which reach
 * huntRuntime.toolPointer* and then nativeHuntFieldControls. Touch does reach
 * the rope. The mistake was tracing the effect backwards from its draw site,
 * finding the dead legacy endEnclosureStroke path (which returns
 * TOOL_TRACE_REQUIRED and is consumed by nothing), and stopping there.
 *
 * What is true: every loadout slot starts itemId null, and entry is
 * deliberately allowed with nothing equipped, so pressing 開始狩獵 without
 * equipping publishes ROPE enabled:false and leaves only the hand — nothing can
 * be worn down and nothing caught. This fixture now equips the rope first.
 *
 * Even so, a capture is not completed here: binding needs a stroke the
 * recognizer accepts, and synthetic world-coordinate circles do not satisfy it.
 * That is this harness's limit, not the game's. The effect is unverified
 * visually, not unreachable.
 */
import { createChampionshipStandaloneApp } from '../../src/championship/app/championshipStandaloneApp.js';
import { createGateHuntPresentationSource } from '../../src/championship/app/gateHuntPresentationSource.js';
import { createHuntFieldView } from '../../src/championship/app/vs2Screens.js';
import { createChampionshipPixiStage } from '../../src/championship/presentation/championshipPixiStage.js';
import { mountHuntFieldPixiPresentation } from '../../src/championship/presentation/vs2/createHuntFieldPixiPresentation.js';
import { applyQaUnlock } from '../../src/championship/app/qaUnlock.js';
import { listChampionshipGates } from '../../src/championship/gate/gateCatalog.js';
import { liveCaptureReplay } from './championship-live-capture-replay.mjs';

const read = async path => (await fetch(path)).json();
// The same bounded soft-pull replay the hunt result fixture uses. The native
// entry path does wear a creature down, but only from a real rope stroke at a
// real distance; this replay is the established way to reach a finished
// capture deterministically, and it is what makes the phase clock observable.
const [catalog, presentation, encounter, touch] = await Promise.all([
  read('../../src/data/championship/catalogs/creature-species.r1.json'),
  read('../../docs/contracts/championship/raising-home-presentation.v1.json'),
  read('../../docs/research/HUNT_LIVE_ENCOUNTER_REPLAY_2026-09-05.json'),
  read('../../docs/research/HUNT_NATIVE_TOUCH_REPLAY_2026-09-05.json')]);
const values = new Map();
const storage = { getItem: k => values.get(k) ?? null, setItem: (k, v) => values.set(k, v), removeItem: k => values.delete(k) };
const app = createChampionshipStandaloneApp({ storage, catalog, cages: presentation.cages });
await app.newGame();

// A fresh tamer holds 0 bits and the first gate reads GATE_LOCKED, so supply the
// prerequisites through the application's own seams. Admission still decides.
applyQaUnlock(app, listChampionshipGates());
app.openGate(); app.selectGate(app.getGates()[0].gateId); app.confirmGate();
// EQUIP THE ROPE. Owning it is not enough: every loadout slot starts
// itemId null, and entry is deliberately allowed with nothing equipped, so
// walking straight past the loadout screen gives a field with the rope button
// disabled and only the hand available -- nothing can be worn down, and
// nothing can be caught.
const loadout = app.getHuntLoadout();
const ropeItem = loadout.listAvailableEquipment().find(x => x.equipmentClass === 'ROPE')?.items?.[0];
if (ropeItem) loadout.selectEquipment('ROPE', ropeItem.itemId);
await app.beginHunt();
const runtime = app.getHuntRuntime();
if (!runtime) throw new Error(`fixture could not enter: ${JSON.stringify(app.getGateAdmission(app.getGates()[0].gateId))}`);

const source = createGateHuntPresentationSource(app);
const root = document.querySelector('#app');
const PIXI = await import('../../node_modules/pixi.js/dist/pixi.mjs');

// Mount the real Hunt field the way main.js does, so the effect under review is
// drawn by the shipped presentation rather than a stand-in.
const view = await createHuntFieldView({
  root, source,
  async mountField({ host, source: fieldSource, onActorFrame }) {
    const stage = await createChampionshipPixiStage({ PIXI, canvasHost: host });
    return await mountHuntFieldPixiPresentation({ stage, source: fieldSource, onActorFrame });
  }
});
source.subscribe(frame => { if (frame.screen === 'HUNT_FIELD') view.render(frame); });

// Keep the presentation ticking; the capture clock is the native phase counter,
// but the effect is drawn on the ordinary render loop.
const phaseOut = document.querySelector('#phase');
let target = null;
function report(note) {
  const state = target ? runtime.getCaptureRecord?.(target) : null;
  const view = source.field.getView({ viewportWidth: 430, viewportHeight: 780 });
  const fx = view?.tools?.captureEffects ?? null;
  const card = view?.wildCreatures?.find(w => w.wildId === target)?.state ?? '-';
  phaseOut.textContent = `${note} | hp=${state?.currentHp ?? '-'} | card=${card}`
    + ` | captureEffects=${fx === null ? 'ABSENT' : fx.length}`
    + (fx && fx[0] ? ` phase=${fx[0].phase} counter=${fx[0].counter}` : '');
  document.body.dataset.vfxPhase = note;
  document.body.dataset.vfxCount = String(fx === null ? -1 : fx.length);
}

document.querySelector('#run').onclick = async () => {
  const wilds = runtime.getWildCreatures();
  target = wilds[0]?.wildId;
  if (!target) { report('no wild creature'); return; }
  const wild = wilds[0];
  // The tool must be chosen first. The rope is what wears a creature down; with
  // the hand selected a drag is a camera pan, which is why an earlier attempt
  // through raw mouse events did nothing.
  const chosen = source.intents.selectHuntTool('ROPE');
  report(`rope selected=${chosen}`);
  // World coordinates straight into the published intents, so this exercises
  // the same chain a touch does without depending on screen geometry.
  source.intents.toolPointerDown(wild.worldX, wild.worldY);
  for (let i = 0; i < 240; i++) {
    const a = (i / 24) * Math.PI * 2;
    source.intents.toolPointerMove(wild.worldX + Math.cos(a) * 26, wild.worldY + Math.sin(a) * 26);
    runtime.tick(16);
  }
  source.intents.toolPointerUp(wild.worldX, wild.worldY);
  for (let i = 0; i < 120; i++) runtime.tick(16);
  report('after rope stroke');
  await new Promise(r => setTimeout(r, 500));
  // Pull: hold and drag away, which is what takes stamina off.
  for (let pull = 0; pull < 40; pull++) {
    source.intents.toolPointerDown(wild.worldX, wild.worldY);
    for (let i = 0; i < 20; i++) { source.intents.toolPointerMove(wild.worldX - 70, wild.worldY); runtime.tick(16); }
    source.intents.toolPointerUp(wild.worldX - 70, wild.worldY);
    for (let i = 0; i < 20; i++) runtime.tick(16);
    if (pull % 10 === 0) report(`pull ${pull}`);
    await new Promise(r => setTimeout(r, 40));
  }
  report('pulled');
};
document.querySelector('#step').onclick = () => {
  if (!target) return;
  runtime.tickNativeCapturePhases(target);
  report('stepped');
};
report('ready');
</script></html>
