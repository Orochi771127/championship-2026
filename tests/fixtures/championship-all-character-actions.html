<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/">
<title>全角色動作驗證台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9f5ff;color:#122c49;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:14px}h1{font-size:22px;margin:4px 0 8px}p{font-size:13px;line-height:1.5;margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}button,input{font:inherit;min-height:44px;border:1px solid #85afd1;border-radius:8px;background:white;padding:6px 10px;color:inherit}button:active{background:#bbeaff}button:disabled{opacity:.5}input{width:78px}#field{aspect-ratio:416/272;background:#d4e8f1;border-radius:14px;overflow:hidden;border:2px solid #71a6c8;position:relative}#field canvas{display:block}#names{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;margin-top:10px}#names span{padding:6px;background:white;border-radius:6px}output{display:block;font-size:12px;white-space:pre-wrap;line-height:1.5}
</style></head><body><main><h1>全角色動作驗證台</h1>
<p>測試專用：使用遊戲現有角色載入器與對戰動畫管線。以下按鈕指定原作通知條件，檢查影格與比例；不代表這些條件已經在正常戰鬥中全部串接。</p>
<div class="controls"><button id="mixed">代表體型</button><button id="large">大型角色</button><button id="eggs">數碼蛋</button></div>
<div class="controls"><label>角色起始 ID <input id="first" type="number" min="0" max="227" value="34"></label><button id="load">載入六隻</button></div>
<div class="controls"><button data-notify="1">待機</button><button data-notify="3">移動</button><button data-notify="8">攻擊動作一</button><button data-notify="9">攻擊動作二</button><button data-notify="10">攻擊動作三</button><button data-notify="11">攻擊動作四</button><button data-notify="15" data-hit="3">受擊反應 3</button><button data-notify="15" data-hit="6">受擊反應 6</button><button data-notify="18">倒下</button><button data-notify="20">復起</button></div>
<div id="field" aria-label="角色動作畫面"></div><div id="names"></div>
<div class="controls"><button id="step">推進六幀</button><button id="play">播放</button><button id="pause">暫停</button><label><input id="reduce" type="checkbox">減少動態效果</label></div><output id="receipt" role="status">載入中</output></main>
<script type="module">
import * as PIXI from '/node_modules/pixi.js/dist/pixi.mjs';
import {createChampionshipPixiStage} from '/src/championship/presentation/championshipPixiStage.js';
import {mountBattleFieldPixiPresentation} from '/src/championship/presentation/vs5/createBattleFieldPixiPresentation.js';
import {loadLicensedCharacterRoster,LICENSED_CHARACTER_MANIFEST} from '/src/championship/presentation/licensedCharacterRoster.js';
import {loadRuntimeMapArtField} from '/src/championship/presentation/runtimeMapArtBundle.js';
import {createBattlePresentationSource} from '/src/championship/app/battlePresentationSource.js';
import {createBattleSession,createSessionCombatant} from '/src/championship/battle/battleSession.js';
import {createChannelRng} from '/src/championship/battle/battleRngChannel.js';
import manifest from '/assets/production/internal-faithful-baseline/characters-v1/manifest.json' with {type:'json'};
import productionIndex from '/assets/production/ART_PRODUCTION_INDEX.json' with {type:'json'};
import arenaManifest from '/assets/production/battle/licensed-runtime-v1/manifest.json' with {type:'json'};
const stage=await createChampionshipPixiStage({PIXI,canvasHost:document.querySelector('#field')});stage.app.ticker.stop();
let scene,source,session,busy=false,ids=[34,81,113,146,204,217];
const output=document.querySelector('#receipt'),reduce=document.querySelector('#reduce');
function receipt(){
 const chars=scene.getDiagnostics().characters;
 output.textContent=`已載入 ${chars.length} 隻 · 影格 ${session.frame}\n`+chars.map(c=>`${c.entityId}: 原始動作 ${c.animation?.sequenceId??'未綁定'} / 影格 ${c.animation?.frameIndex??'-'}`).join('\n');
 output.dataset.characters=JSON.stringify(chars.map(c=>({entityId:c.entityId,rendered:c.rendered,sequence:c.animation?.sequenceId,frame:c.animation?.frameIndex,geometry:c.animation?.geometry})));
 stage.app.render();
}
async function load(next){
 if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);stage.app.ticker.stop();
 try{
  const previous=scene;scene=null;await previous?.dispose();source?.dispose();ids=next;
  session=createBattleSession({roster:ids.map(speciesId=>createSessionCombatant({speciesId,currentHp:100,maxHp:100})),rng:createChannelRng(1)});
  // Explicit pose fixture. Only the existing session frame advances; it does
  // not pretend to run AI, damage, status conditions or progression.
  source=createBattlePresentationSource({session,step:s=>{s.frame++;}});
  const roster=await loadLicensedCharacterRoster({PIXI,speciesIds:ids.map(i=>`species-${String(i).padStart(3,'0')}`),manifest,productionIndex,
   manifestUrl:new URL(LICENSED_CHARACTER_MANIFEST,location.origin+'/').href});
  const fieldArt=await loadRuntimeMapArtField({PIXI,manifest:arenaManifest,fieldId:source.getFrame().arena.field});
  scene=await mountBattleFieldPixiPresentation({stage,source,fieldArt,characterRoster:roster,reducedMotion:reduce.checked});
  const labels=document.querySelector('#names');labels.replaceChildren();
  source.getFrame().combatants.forEach(c=>{const span=document.createElement('span');span.textContent=`${c.speciesId} · ${c.displayName}`;labels.append(span);});receipt();
 }catch(e){output.textContent='載入錯誤：'+e.message;throw e;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
document.querySelector('#mixed').onclick=()=>load([34,81,113,146,204,217]);
document.querySelector('#large').onclick=()=>load([197,204,212,213,216,217]);
document.querySelector('#eggs').onclick=()=>load([0,1,2,3,4,5]);
document.querySelector('#load').onclick=()=>{const first=Math.min(227,Math.max(0,Number(document.querySelector('#first').value)||0));load(Array.from({length:6},(_,i)=>(first+i)%228));};
document.querySelectorAll('[data-notify]').forEach(b=>b.onclick=()=>{
 stage.app.ticker.stop();session.slots.forEach(c=>{c.field17C=Number(b.dataset.notify);c.field84=Number(b.dataset.hit??0);c.battleEnding=0;});
 scene.advance();receipt();
});
document.querySelector('#step').onclick=()=>{stage.app.ticker.stop();for(let i=0;i<6;i++)scene.advance();receipt();};
document.querySelector('#play').onclick=()=>stage.app.ticker.start();
document.querySelector('#pause').onclick=()=>{stage.app.ticker.stop();receipt();};
reduce.onchange=()=>load(ids);
stage.onResize(()=>{if(scene)receipt();});
await load(ids);
</script></body></html>
