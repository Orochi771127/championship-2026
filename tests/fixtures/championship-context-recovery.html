<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>場景恢復驗收</title><style>body{font:16px sans-serif;margin:10px;background:#edf3f5}iframe{display:block;width:390px;height:760px;border:1px solid #aaa}button{padding:10px;margin:6px}</style><button id="lose">中斷 GPU</button><button id="restore">恢復 GPU</button><output id="status">等待遊戲場景</output><iframe title="遊戲" src="../../championship.html"></iframe><script>
const frame=document.querySelector('iframe');let extension=null,canvas=null;
document.querySelector('#lose').onclick=()=>{canvas=frame.contentDocument.querySelector('canvas.cm-field-canvas');if(!canvas){document.querySelector('#status').textContent='尚無場景';return;}const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');extension=gl?.getExtension('WEBGL_lose_context');if(!extension){document.querySelector('#status').textContent='不支援受控 GPU 中斷';return;}canvas.addEventListener('webglcontextlost',()=>document.querySelector('#status').textContent='GPU 已中斷',{once:true});canvas.addEventListener('webglcontextrestored',()=>document.querySelector('#status').textContent=frame.contentDocument.querySelector('canvas.cm-field-canvas')===canvas?'GPU 已恢復；同一畫布':'畫布已被替換',{once:true});extension.loseContext();};document.querySelector('#restore').onclick=()=>extension?.restoreContext();
</script></html>
