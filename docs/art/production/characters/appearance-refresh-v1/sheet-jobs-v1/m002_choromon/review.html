<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>m002 動作返修 r03 Higgsfield</title>
<style>
body{margin:0;padding:28px;background:#17202c;color:#ecf2f8;font:16px system-ui;max-width:1100px}h1{font-size:26px}p{line-height:1.65}.muted{color:#b2c2d2}.stages{display:flex;gap:24px;flex-wrap:wrap}.stage{background:repeating-conic-gradient(#293445 0% 25%,#24303f 0% 50%) 0/16px 16px;image-rendering:pixelated}.light .stage{background:repeating-conic-gradient(#f4ede0 0% 25%,#e1dacd 0% 50%) 0/16px 16px}button,select,input{font:inherit;border:1px solid #71859a;border-radius:6px;padding:8px;background:#304155;color:white}button{margin:8px 8px 8px 0}input{width:70px}select{max-width:100%}canvas{display:block}figure{margin:0}figcaption{margin-top:12px}a{color:#a2d6ff}#coverage{color:#ffd459}#snapshot{white-space:pre-wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:8px}.tile{padding:10px;background:#253242;border:1px solid #465363;font-size:12px}.tile img{width:64px;height:64px;image-rendering:pixelated}.missing{height:64px;display:grid;place-items:center;color:#97a2ad}#error{color:#ffaaaa}
</style>
<h1>m002｜動作返修 r03 Higgsfield</h1><p id="coverage">載入中</p>
<p class="muted">GPT Image 2.5 已返修六個被綁姿勢的繩帶，保留原始輪廓、表情與 origin。83格與53組原始序列可檢視；整隻美術與正式遊戲仍待驗收。</p>
<label>動作序列 <select id="sequence" disabled></select></label><p id="timing"></p>
<div class="stages"><figure><canvas id="large" class="stage" width="512" height="512"></canvas><figcaption>8 倍整數放大 · 共用 origin (24,38)</figcaption></figure><figure><canvas id="four" class="stage" width="256" height="256"></canvas><figcaption>4 倍整數放大</figcaption></figure><figure><canvas id="native" class="stage" width="64" height="64"></canvas><figcaption>實際 64×64</figcaption><p id="cell"></p><pre id="snapshot"></pre><button id="background">切換淺／深底</button></figure></div>
<label><input id="origin-guide" type="checkbox" checked> 顯示共同原點與基準線</label><br><button id="play" disabled>从頭播放</button><button id="step" disabled>前進 1 tick</button><button id="reset" disabled>回到開頭</button>
<label>檢視速度 <input id="rate" type="number" min="1" max="120" value="30"> ticks／秒</label>
<p class="muted">速度僅供看稿，不推定原作 Hz。順序、每格 ticks、loopStartFrame 和 mode 直接沿用 motion contract。未繪格明列缺少，不用現有圖片補滿。</p>
<p><a href="candidate-r03-higgsfield-final/main-contact.png">Main 完整編號圖</a> · <a href="candidate-r03-higgsfield-final/sub-contact.png">Sub 完整編號圖</a> · <a href="candidate-r03-higgsfield-final/bank.json">畫格與序列</a> · <a href="candidate-r03-higgsfield-final/cell-review.json">逐格待審查清單</a></p><p id="error"></p>
<h2>Main</h2><div id="main" class="gallery"></div><h2>Sub</h2><div id="sub" class="gallery"></div>
<script type="module">
import {createNativeCharacterAnimationTimeline} from '/src/championship/presentation/characterAnimationTimeline.js';
try{
 const bank=await (await fetch('candidate-r03-higgsfield-final/bank.json')).json(),images=new Map();
 for(const [key,record] of Object.entries(bank.cells)){const image=new Image();image.src='candidate-r03-higgsfield-final/'+record.image;await image.decode();images.set(key,image);}
 const contract=await (await fetch('/docs/art/production/characters/appearance-refresh-v1/generated/entities/m002_choromon/motion-contract.json')).json();
 for(const side of ['main','sub']){for(const raw of contract.sides[side].frameKeys){const key=raw.slice(bank.entityId.length+1),tile=document.createElement('div');tile.className='tile';const image=images.get(key);if(image){const clone=image.cloneNode();clone.className='stage';tile.append(clone);}else{const placeholder=document.createElement('div');placeholder.className='missing';placeholder.textContent='未繪';tile.append(placeholder);}const label=document.createElement('div');label.textContent=key.split('/')[1];tile.append(label);document.querySelector('#'+side).append(tile);}}
 const selector=document.querySelector('#sequence');
 for(const entry of bank.sequences){if(JSON.stringify(entry.sequence)!==JSON.stringify(contract.sides[entry.side].sequences.find(s=>s.id===entry.sequence.id)))throw Error('MOTION_CONTRACT_DRIFT');const option=document.createElement('option');option.value=entry.side+':'+entry.sequence.id;option.textContent=`${entry.side} sequence ${entry.sequence.id}${entry.available?'':'（缺格）'}`;option.disabled=!entry.available;selector.append(option);}
 document.querySelector('#coverage').textContent=`保留 ${bank.authoredMasters+bank.derivedMasters} 個母格 + ${bank.generatedCandidateMasters} 個新候選 · ${bank.deliveredSlots}/${bank.requiredSlots} 槽位有圖 · ${bank.availableSequences}/${bank.requiredSequences} 組序列可檢視 · 美術未驗收`;
 let selected,timeline,timer=null;
 function stop(){clearInterval(timer);timer=null;}
 function draw(){const state=timeline.getSnapshot(),image=images.get(selected.side+'/cell_'+String(state.cell).padStart(3,'0'));if(!image)throw Error('MISSING_FRAME');for(const id of ['large','four','native']){const canvas=document.querySelector('#'+id),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);if(document.querySelector("#origin-guide").checked){const z=canvas.width/64;ctx.strokeStyle="rgba(80,210,255,.6)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(24*z+.5,0);ctx.lineTo(24*z+.5,canvas.height);ctx.moveTo(0,38*z+.5);ctx.lineTo(canvas.width,38*z+.5);ctx.stroke();}}document.querySelector('#cell').textContent=`${selected.side} cell ${String(state.cell).padStart(3,'0')}`;document.querySelector('#snapshot').textContent=`frame ${state.frameIndex}\nelapsed Q12 ${state.elapsedQ12}\nactive ${state.active}\nmode ${state.playMode}`;document.body.dataset.cell=String(state.cell);document.body.dataset.active=String(state.active);return state;}
 function reset(){stop();timeline=createNativeCharacterAnimationTimeline(selected.sequence);draw();}
 function select(){selected=bank.sequences.find(s=>s.side+':'+s.sequence.id===selector.value);if(!selected?.available)throw Error('INCOMPLETE_SEQUENCE');document.querySelector('#timing').textContent=selected.sequence.frames.map(f=>`cell ${f.cell}: ${f.ticks} ticks`).join(' → ')+` · mode ${selected.sequence.playbackMode} · loop start ${selected.sequence.loopStartFrame}`;reset();}
 function step(){timeline.advanceNative(4096);if(!draw().active)stop();}
 document.querySelector("#origin-guide").onchange=draw;selector.onchange=select;selector.value='main:7';select();selector.disabled=false;
 document.querySelector('#play').onclick=()=>{reset();const rate=Number(document.querySelector('#rate').value);if(Number.isFinite(rate)&&rate>=1&&rate<=120)timer=setInterval(step,1000/rate);};document.querySelector('#step').onclick=()=>{stop();step();};document.querySelector('#reset').onclick=reset;document.querySelector('#background').onclick=()=>document.body.classList.toggle('light');for(const id of ['play','step','reset'])document.querySelector('#'+id).disabled=false;document.body.dataset.ready='true';
}catch(error){document.querySelector('#error').textContent=String(error);throw error;}
</script></html>
