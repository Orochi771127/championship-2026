<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M201 A · 姿態與透明輸出檢查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#26392f;font:16px/1.7 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:30px;line-height:1.3}h2{font-size:21px}a{color:#236347}button{padding:9px 15px;border:1px solid #b8c3b8;background:white;border-radius:5px;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a67b2b;outline-offset:3px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{padding:18px;border:1px solid #d1d8cd;border-radius:8px;background:#fff9}.viewport{position:relative;aspect-ratio:464/368;background-color:#e8e8e8;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.viewport.dark{background:#172331}.viewport.green{background:#326d44}.viewport img{display:block;width:100%;height:100%;object-fit:contain}.viewport svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.overlay-off svg{display:none}.status{font-size:14px;padding:10px 13px;background:#eee3c9;border-radius:4px}.muted{color:#657169;font-size:14px}.metrics{font-size:14px;white-space:pre-line}.error{color:#9a3728}footer{margin-top:30px;border-top:1px solid #ccc;padding-top:20px;font-size:14px}@media(max-width:700px){.cards{grid-template-columns:1fr}main{padding:20px 14px}h1{font-size:25px}}
</style></head><body><main>
<p class="muted">M201 · Owner 選定 A · 製作檢查</p><h1>同一外觀，逐格核對原來的位置。</h1>
<p>這裡顯示生成試稿與實際 RGBA 輸出。切換底色可檢查透明是否成立；框線來自原始姿態的可見部位區域草稿，並非已核准的碰撞點或骨架。</p>
<p id="status" class="status">正在讀取製作紀錄…</p>
<div class="tools"><button data-bg="checker">棋盤底</button><button data-bg="dark">深色底</button><button data-bg="green">草地色底</button><button id="overlay" aria-pressed="true">位置區域：顯示</button></div>
<div id="cards" class="cards"></div>
<footer><a href="../batch-01/review.html">第一批選案</a> · <a href="README.md">M201 製作紀錄</a> · <a href="pose-lock-draft.json">來源區域與序列</a><p>位置、透明輸出、外觀一致性及完整動畫各自驗收。這個檢查頁不會切換正常遊戲角色。</p></footer>
</main><script type="module">
const holder=document.querySelector('#cards');
function node(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
try{
 const responses=await Promise.all([fetch('chroma-progress.json'),fetch('pose-lock-draft.json')]);if(responses.some(r=>!r.ok))throw Error('製作資料尚未就緒');const [data,lock]=await Promise.all(responses.map(r=>r.json()));
 document.querySelector('#status').textContent=data.summary;
 for(const item of data.candidates){
  const card=node('section',null,'card');card.append(node('h2',item.title));const view=node('div',null,'viewport');
  if(!/^[a-z0-9_./-]+\.png$/i.test(item.image)||item.image.includes('..'))throw Error('圖片路徑不正確');const im=node('img');im.src=item.image;im.alt=item.title;view.append(im);
  const pose=lock.poses.find(p=>p.side==='main'&&p.cell===0);if(pose){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 464 368');svg.setAttribute('aria-hidden','true');for(const r of pose.observedRegions){const [x,y,x2,y2]=r.logicalReviewRegion;const rect=document.createElementNS(svg.namespaceURI,'rect');for(const [k,v]of Object.entries({x,y,width:x2-x,height:y2-y,fill:'none',stroke:'#00c9d9','stroke-width':1.1,'stroke-dasharray':'4 3'}))rect.setAttribute(k,String(v));svg.append(rect);}view.append(svg);}
  card.append(view,node('p',item.result,'status'),node('p',item.metrics,'metrics'),node('p',item.note,'muted'));holder.append(card);
 }
}catch(e){document.querySelector('#status').textContent=e.message;document.querySelector('#status').classList.add('error');}
for(const button of document.querySelectorAll('[data-bg]'))button.addEventListener('click',()=>{for(const view of document.querySelectorAll('.viewport')){view.classList.remove('dark','green');if(button.dataset.bg!=='checker')view.classList.add(button.dataset.bg);}});
document.querySelector('#overlay').addEventListener('click',e=>{const hidden=holder.classList.toggle('overlay-off');e.currentTarget.setAttribute('aria-pressed',String(!hidden));e.currentTarget.textContent=`位置區域：${hidden?'隱藏':'顯示'}`;});
</script></body></html>
