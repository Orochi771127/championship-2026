name: Ranch actual depth pipeline diagnostics
on:
  push:
    branches: ['fix/ranch-floor-contact-audit-20261021']
    paths:
      - '.github/workflows/ranch-depth-pipeline-review.yml'
      - 'src/championship/presentation/ranchThreeScene.js'
      - 'tests/ranch-depth-pipelines.mjs'
      - 'tests/fixtures/ranch-depth-audit.html'
      - 'tests/ranch-depth-probe/**'
      - 'tests/ranch-depth-review/**'
      - 'tests/ranch-water-review/inject-effect-diagnostics.mjs'
      - 'tests/ranch-floor-data/**'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Preserve existing build validation
        run: npm run build:playtest && npm run validate:playtest
      - name: Measure default and offscreen depth with explicit shared effect repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/baseline .tmp/depth-pipeline/${{ matrix.engine }}
          git show 4f64421314f0d0f5d0c04b916d30e821587c1a6a:src/championship/presentation/ranchThreeScene.js > .tmp/baseline/ranchThreeScene.js
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/depth-pipeline/${{ matrix.engine }}/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-depth-audit.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-depth-audit.html > /dev/null
          node tests/ranch-depth-pipelines.mjs http://127.0.0.1:8765/ ${{ matrix.engine }} .tmp/depth-pipeline/${{ matrix.engine }}/cases .tmp/baseline/ranchThreeScene.js tests/ranch-floor-data/admitted-probes-v2.json tests/ranch-floor-data/coverage-37fields-100slots.json tests/ranch-floor-data/coverage-plan.json tests/ranch-depth-review/baseline4f-water-ice-repair.js tests/ranch-depth-review/floor-water-ice-repair.js
      - name: Preserve pipeline contradiction evidence, not release acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranch-depth-pipeline-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/depth-pipeline/
          if-no-files-found: error
          retention-days: 14
