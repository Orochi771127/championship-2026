name: Raising hints actual browser evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/raising-hints-browser.yml'
      - 'tests/championship-raising-hints-browser.mjs'
      - 'tests/browser-qa-output.cjs'
      - 'tests/fixtures/championship-owned-party.html'
      - 'src/championship/app/transientHint.js'
      - 'src/championship/app/raisingHomeP1RView.js'
      - 'src/championship/app/championshipToolbar.js'
      - 'src/championship/app/championshipStatusBar.js'
      - 'src/championship/app/main.js'
      - 'src/championship/app/portraitFrame.js'
      - 'src/championship/app/*Styles.css'
      - 'src/championship/app/styles.css'
      - 'src/championship/app/nativeUiSkin.css'
      - 'src/championship/app/ui/tokens.css'
      - 'src/championship/text/**'
      - 'championship.html'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the dedicated runner assertions
        run: node --check tests/championship-raising-hints-browser.mjs && node tests/championship-raising-hints-browser.mjs --self-test
      - run: npx playwright install --with-deps chromium
      - name: Build and validate existing playtest
        run: npm run build:playtest && npm run validate:playtest
      - name: Measure three viewports, five languages, two HUDs, timing and actual tool operation
        env:
          HINT_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HINT_QA_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/browser-qa/raising-hints
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/browser-qa/raising-hints/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/championship-owned-party.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/championship-owned-party.html > /dev/null
          node tests/championship-raising-hints-browser.mjs http://127.0.0.1:8765/ .tmp/browser-qa/raising-hints
      - name: Preserve measured rectangles, timer evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raising-hints-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/browser-qa/raising-hints/*.png
            .tmp/browser-qa/raising-hints/*.json
            .tmp/browser-qa/raising-hints/server.log
          if-no-files-found: warn
          retention-days: 14
