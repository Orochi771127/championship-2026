name: Ranch terrain visibility mask diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/ranch-terrain-mask-review.yml'
      - 'src/championship/presentation/ranchThreeScene.js'
      - 'tests/fixtures/ranch-mask-audit.html'
      - 'tests/ranch-cm07-terrain-mask.mjs'
      - 'tests/compare-cm07-terrain-mask.py'
      - 'tests/ranch-mask-probe/**'
      - 'tests/ranch-floor-data/**'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Preserve existing build validation
        run: npm run build:playtest && npm run validate:playtest
      - name: Measure bounded CM07 terrain masks without changing production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/baseline .tmp/terrain-mask/${{ matrix.engine }}
          git show 4f64421314f0d0f5d0c04b916d30e821587c1a6a:src/championship/presentation/ranchThreeScene.js > .tmp/baseline/ranchThreeScene.js
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/terrain-mask/${{ matrix.engine }}/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-mask-audit.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-mask-audit.html > /dev/null
          node tests/ranch-cm07-terrain-mask.mjs http://127.0.0.1:8765/ ${{ matrix.engine }} .tmp/terrain-mask/${{ matrix.engine }}/cases .tmp/baseline/ranchThreeScene.js tests/ranch-floor-data/cm07-extreme-plan.json tests/ranch-floor-data/coverage-37fields-100slots.json
          python tests/compare-cm07-terrain-mask.py .tmp/terrain-mask/${{ matrix.engine }}/cases
      - name: Preserve bounded measurements, not release acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranch-terrain-mask-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/terrain-mask/
          if-no-files-found: error
          retention-days: 14
# Known expected floor/near/far controls and human review are mandatory before
# treating this diagnostic shader as a trusted visibility oracle.
