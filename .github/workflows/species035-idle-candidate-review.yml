name: Species035 idle candidate-only PIXI review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/species035-idle-candidate-review.yml'
      - 'tests/championship-species035-idle-candidate-review.mjs'
      - 'tests/fixtures/species035-idle-candidate/**'
      - 'tests/ci-test-scope.v1.json'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the dedicated actual-renderer runner
        run: node --check tests/championship-species035-idle-candidate-review.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build and validate the existing playtest artifact
        run: npm run build:playtest && npm run validate:playtest
      - name: Review only two035 candidate frames against current reference; no runtime replacement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/browser-qa/species035-idle-candidate
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/browser-qa/species035-idle-candidate/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/species035-idle-candidate/index.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/species035-idle-candidate/index.html > /dev/null
          node tests/championship-species035-idle-candidate-review.mjs \
            http://127.0.0.1:8765/ \
            tests/fixtures/species035-idle-candidate/ \
            .tmp/browser-qa/species035-idle-candidate
      - name: Preserve real renderer screenshots and exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: species035-idle-candidate-renderer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/browser-qa/species035-idle-candidate/*.png
            .tmp/browser-qa/species035-idle-candidate/*.json
            .tmp/browser-qa/species035-idle-candidate/server.log
          if-no-files-found: warn
          retention-days: 14
