name: UI audit browser regressions

on:
  pull_request:
    paths:
      - '.github/workflows/ui-audit-browser.yml'
      - 'tests/championship-ui-audit-browser.cjs'
      - 'tests/alternate-form-browser-support.cjs'
      - 'tests/browser-qa-output.cjs'
      - 'assets/production/**'
      - 'src/championship/**'
      - 'src/data/championship/**'
      - 'championship.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify rendered shop contrast, text scale and keyboard behavior
        run: node tests/championship-ui-audit-browser.cjs

      - name: Upload browser receipt and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-browser-${{ github.sha }}
          path: .tmp/browser-qa/ui-audit/
          if-no-files-found: warn
          retention-days: 14
