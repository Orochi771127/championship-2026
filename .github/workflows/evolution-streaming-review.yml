name: Evolution streaming freeze actual browser gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/evolution-streaming-review.yml'
      - 'tests/championship-evolution-streaming-browser.cjs'
      - 'src/championship/presentation/intRh2/createRaisingFieldPixiPresentation.js'
      - 'src/championship/app/main.js'
      - 'src/championship/app/raisingHomeP1RView.js'
      - 'src/championship/app/intRh2Styles.css'
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check tests/championship-evolution-streaming-browser.cjs
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Validate unchanged release build pipeline
        run: npm run build:playtest && npm run validate:playtest
      - name: Exact baseline and fixed native evolution on actual mobile renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/browser-qa/evolution
          git show 3b3ff45a0bd6486b8e24b45f3010bb8e8f2dec97:src/championship/presentation/intRh2/createRaisingFieldPixiPresentation.js > .tmp/evolution-baseline-presenter.js
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/browser-qa/evolution/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/championship.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          node tests/championship-evolution-streaming-browser.cjs http://127.0.0.1:8765/ ${{ matrix.engine }} .tmp/browser-qa/evolution --baseline
          node tests/championship-evolution-streaming-browser.cjs http://127.0.0.1:8765/ ${{ matrix.engine }} .tmp/browser-qa/evolution
      - name: Preserve actual screenshots and bounded synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-streaming-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/browser-qa/evolution/
          if-no-files-found: error
          retention-days: 14
