name: Scene music actual browser evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scene-music-browser.yml'
      - 'tests/championship-scene-music-browser.mjs'
      - 'tests/browser-qa-output.cjs'
      - 'tests/fixtures/championship-owned-party.html'
      - 'src/championship/app/main.js'
      - 'src/championship/app/settings/**'
      - 'src/championship/app/ui/settings.css'
      - 'src/championship/app/ChampionshipPersistentSavePort.js'
      - 'src/championship/app/dataArenaScreen.js'
      - 'src/championship/app/vs5Screens.js'
      - 'src/championship/presentation/*Music*.js'
      - 'src/championship/presentation/musicPresentation.js'
      - 'src/championship/presentation/audioBus.js'
      - 'src/championship/text/**'
      - 'assets/production/scene-music-r1/**'
      - 'assets/production/original-music-r1/**'
      - 'championship.html'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check dedicated media assertions
        run: node --check tests/championship-scene-music-browser.mjs && node tests/championship-scene-music-browser.mjs --self-test
      - run: npx playwright install --with-deps chromium
      - name: Build and validate existing playtest
        run: npm run build:playtest && npm run validate:playtest
      - name: Verify native MP3 decoding, settings and controlled normal-game routes
        env:
          BGM_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BGM_QA_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/browser-qa/scene-music
          node tests/championship-scene-music-browser.mjs --serve 8765 . > .tmp/browser-qa/scene-music/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/championship-owned-party.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/championship-owned-party.html > /dev/null
          node tests/championship-scene-music-browser.mjs http://127.0.0.1:8765/ .tmp/browser-qa/scene-music
      - name: Preserve light media, layout and normal-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-music-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/browser-qa/scene-music/*.png
            .tmp/browser-qa/scene-music/*.json
            .tmp/browser-qa/scene-music/server.log
          if-no-files-found: warn
          retention-days: 14
