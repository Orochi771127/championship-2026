name: Verify live public performance release
on:
  push:
    branches: [ops/live-performance-smoke-20261106]
    paths:
      - .github/workflows/ops-live-performance-smoke.yml
      - ops/live-performance-smoke.cjs
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_PUBLIC_COMMIT: 7312a31c2723d315517d5f64efbef0c1b7a4d1ce
      EXPECTED_PUBLIC_BUILD: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /ops/live-performance-smoke.cjs
            /scripts/lib/build-manifest-codec.mjs
            /tests/championship-browser-opening.cjs
            /qa/championship-full-qa-save.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check ops/live-performance-smoke.cjs
      - name: Record installed Chrome and install pinned CJK font only in runner home
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p .tmp/live-release-smoke "$HOME/.local/share/fonts"
          google-chrome --version | tee .tmp/live-release-smoke/browser-environment.txt
          font="$HOME/.local/share/fonts/NotoSansCJKtc-Regular.otf"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 90 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf' -o "$font"
          test "$(git hash-object "$font")" = 'f9376bae1d421520f73a3c6c9d50b22f89548301'
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' 'Noto Sans CJK TC' | tee .tmp/live-release-smoke/font-environment.txt
          grep -F 'Noto Sans CJK TC' .tmp/live-release-smoke/font-environment.txt
          # Fonts stay in runner home; only names, screenshots and QA reports are uploaded.
      - name: Verify served receipt, runtime hashes, mobile and desktop UI
        run: |
          node <<'JS'
          // Only the actual browser channel changes. The live URLs, isolated
          // profiles, response hashes and every gameplay assertion are unchanged.
          const {chromium}=require('playwright');
          const launch=chromium.launch.bind(chromium);
          chromium.launch=options=>launch({...options,channel:'chrome'});
          require('./ops/live-performance-smoke.cjs');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/live-release-smoke/
          if-no-files-found: error
          retention-days: 14
