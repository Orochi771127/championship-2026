name: Verify live public performance release
on:
  push:
    branches: [ops/live-performance-smoke-20261106]
    paths:
      - .github/workflows/ops-live-performance-smoke.yml
      - ops/live-performance-smoke.cjs
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_PUBLIC_COMMIT: 7312a31c2723d315517d5f64efbef0c1b7a4d1ce
      EXPECTED_PUBLIC_BUILD: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /ops/live-performance-smoke.cjs
            /scripts/lib/build-manifest-codec.mjs
            /tests/championship-browser-opening.cjs
            /qa/championship-full-qa-save.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check ops/live-performance-smoke.cjs
      - name: Record the runner's installed Chrome; no apt mirror or browser download
        run: |
          command -v google-chrome
          mkdir -p .tmp/live-release-smoke
          google-chrome --version | tee .tmp/live-release-smoke/browser-environment.txt
      - name: Verify served receipt, runtime hashes, mobile and desktop UI
        run: |
          node <<'JS'
          // Only the actual browser channel changes. The live URLs, isolated
          // profiles, response hashes and every gameplay assertion are unchanged.
          const {chromium}=require('playwright');
          const launch=chromium.launch.bind(chromium);
          chromium.launch=options=>launch({...options,channel:'chrome'});
          require('./ops/live-performance-smoke.cjs');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/live-release-smoke/
          if-no-files-found: error
          retention-days: 14
