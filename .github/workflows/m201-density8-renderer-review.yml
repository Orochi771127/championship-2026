name: M201 selected clarity trial actual renderer review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m201-density8-renderer-review.yml'
      - 'tests/championship-m201-density8-renderer-review.mjs'
      - 'assets/production/characters/accepted-20261010/m201_agumon-r04-density8-07a10bca9765903c/**'
      - 'assets/production/characters/accepted-20261010/m201_agumon-clarity-trial-20261021-r01/**'
      - 'src/data/championship/public-character-catalog.v1.json'
      - 'src/data/championship/accepted-original-character-selection.r1.json'
      - 'src/championship/presentation/completedOriginalM201Review20261007.js'
      - 'src/championship/presentation/vs2/huntContactShadow.js'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the dedicated actual-renderer runner
        run: node --check tests/championship-m201-density8-renderer-review.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build and validate the existing playtest artifact
        run: npm run build:playtest && npm run validate:playtest
      - name: Review all 83 cells and 53 sequences using actual PIXI and native presenters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/browser-qa/m201-density8
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/browser-qa/m201-density8/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/championship-owned-party.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/championship-owned-party.html > /dev/null
          node tests/championship-m201-density8-renderer-review.mjs \
            http://127.0.0.1:8765/ \
            assets/production/characters/accepted-20261010/m201_agumon-clarity-trial-20261021-r01/ \
            .tmp/browser-qa/m201-density8
      - name: Preserve real renderer screenshots and exact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m201-density8-renderer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/browser-qa/m201-density8/*.png
            .tmp/browser-qa/m201-density8/*.json
            .tmp/browser-qa/m201-density8/server.log
          if-no-files-found: warn
          retention-days: 14
