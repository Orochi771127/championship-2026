name: Ranch exact main care image diagnostic
on:
  push:
    branches: ['fix/ranch-floor-contact-audit-20261021']
    paths:
      - '.github/workflows/ranch-main-care-review.yml'
      - 'tests/ranch-main-care.mjs'
      - 'tests/fixtures/ranch-main-care.html'
      - 'tests/ranch-main-care-probe/**'
      - 'tests/ranch-main-care-candidate/**'
      - 'tests/normal-lifecycle/request-audit.mjs'
      - 'tests/ranch-floor-data/admitted-probes-v2.json'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Preserve current branch build validation
        run: npm run build:playtest && npm run validate:playtest
      - name: Verify care-only override in an exact main archive
        shell: bash
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          base=4f64421314f0d0f5d0c04b916d30e821587c1a6a
          test "$(git rev-parse "$base^{commit}")" = "$base"
          mkdir -p .tmp/main-care-app .tmp/main-care/${{ matrix.engine }}
          app="$GITHUB_WORKSPACE/.tmp/main-care-app"
          out="$GITHUB_WORKSPACE/.tmp/main-care/${{ matrix.engine }}"
          git archive "$base" | tar -x -C "$app"
          cmp package-lock.json "$app/package-lock.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$app/node_modules"
          printf '%s\n' "$base" > "$out/archive-commit.txt"
          for path in \
            tests/ranch-main-care.mjs \
            tests/fixtures/ranch-main-care.html \
            tests/ranch-main-care-probe/inject-main-care-diagnostics.mjs \
            tests/ranch-main-care-candidate/src/championship/presentation/intRh2/createRaisingFieldPixiPresentation.js \
            tests/ranch-main-care-candidate/src/championship/presentation/intRh2/careImageTextureScope.js \
            tests/normal-lifecycle/request-audit.mjs \
            tests/ranch-floor-data/admitted-probes-v2.json; do
            mkdir -p "$app/$(dirname "$path")"
            cp "$path" "$app/$path"
          done
          cd "$app"
          echo '865286f7f74ddbdc9391244d623c0cc4d10f2c9031feb4821375d688c7659793  src/championship/presentation/intRh2/createRaisingFieldPixiPresentation.js' | sha256sum -c -
          echo '1d60444883f996bcf939a4989b84bd602efe03cbe7ec35db59ef84f3abb134a6  src/championship/presentation/ranchThreeScene.js' | sha256sum -c -
          npm run build:playtest && npm run validate:playtest
          mkdir -p .tmp/main-care-probe
          node tests/ranch-main-care-probe/inject-main-care-diagnostics.mjs --input tests/ranch-main-care-candidate/src/championship/presentation/intRh2/createRaisingFieldPixiPresentation.js --output .tmp/main-care-probe/presenter.mjs --expected-sha 9abf5f818af06b163a86adda4811a2f200473e204ec2785a6bb7ada4a636210e
          python3 -u -m http.server 8765 --bind 127.0.0.1 > "$out/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-main-care.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-main-care.html > /dev/null
          node tests/ranch-main-care.mjs http://127.0.0.1:8765/ "$out/cases" tests/ranch-main-care-candidate .tmp/main-care-probe/presenter.mjs tests/ranch-floor-data/admitted-probes-v2.json
      - name: Preserve main-context care identity and normal images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranch-main-care-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/main-care/
          if-no-files-found: error
          retention-days: 14
