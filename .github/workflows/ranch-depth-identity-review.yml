name: Ranch depth identity causal diagnostic
on:
  push:
    branches: ['fix/ranch-floor-contact-audit-20261021']
    paths:
      - '.github/workflows/ranch-depth-identity-review.yml'
      - 'tests/ranch-depth-identity/**'
      - 'tests/fixtures/ranch-depth-identity-audit.html'
      - 'tests/ranch-a2-final/**'
      - 'tests/ranch-grass-probe/**'
      - 'tests/ranch-coverage-intensity.mjs'
      - 'tests/ranch-floor-data/motion-mask-plan.json'
      - 'tests/ranch-floor-data/coverage-37fields-100slots.json'
      - 'tests/ranch-b1-batch/calibration-*-39622727547.json'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0 shapely==2.1.2
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify pure support and resolved-coverage controls
        run: node tests/ranch-support-review/support-cases.mjs && node tests/test-ranch-coverage-intensity.mjs
      - name: Preserve existing build validation
        run: npm run build:playtest && npm run validate:playtest
      - name: Pin genuine prior calibration evidence
        run: |
          echo "c411e6caf9d2ad282a7466582fd1635f6f1c4b16d1f75b64fecd997d19d3dc81  tests/ranch-b1-batch/calibration-chromium-39622727547.json" | sha256sum -c -
          echo "b4e280b065a0e4557c1990a60bb75cbf679381f3f8af9e2c0c1e7e8d119fcea7  tests/ranch-b1-batch/calibration-webkit-39622727547.json" | sha256sum -c -
      - name: Compare raw, identity-depth-only and final sources at three exact frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/baseline .tmp/depth-identity/${{ matrix.engine }}
          git show 4f64421314f0d0f5d0c04b916d30e821587c1a6a:src/championship/presentation/ranchThreeScene.js > .tmp/baseline/ranchThreeScene.js
          python3 -u -m http.server 8765 --bind 127.0.0.1 > .tmp/depth-identity/${{ matrix.engine }}/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-depth-identity-audit.html > /dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/tests/fixtures/ranch-depth-identity-audit.html > /dev/null
          node tests/ranch-depth-identity/runner.mjs http://127.0.0.1:8765/ ${{ matrix.engine }} .tmp/depth-identity/${{ matrix.engine }}/cases .tmp/baseline/ranchThreeScene.js tests/ranch-floor-data/motion-mask-plan.json tests/ranch-floor-data/coverage-37fields-100slots.json tests/ranch-b1-batch/calibration-${{ matrix.engine }}-39622727547.json cm07-orbit-frozen-walk-cell-fixed-zoom1
          python tests/ranch-depth-identity/compare.py .tmp/depth-identity/${{ matrix.engine }}/cases tests/ranch-a2-final/oracle
      - name: Preserve causal masks, shaders, actual images and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranch-depth-identity-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/depth-identity/
          if-no-files-found: error
          retention-days: 14
